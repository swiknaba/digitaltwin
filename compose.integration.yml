# Prepared combined local stack. Use only after the referenced components pass
# review and are merged. Root compose.yml remains dependency-only until then.
services:
  local-volume-init:
    environment:
      INIT_RUNTIME_VOLUMES: "true"
    volumes:
      - runtime-home:/volumes/runtime-home
      - runtime-workspace:/volumes/runtime-workspace
      - herdr-socket:/volumes/herdr-socket

  agent-runtime:
    image: digitaltwin-agent-runtime:local
    platform: linux/amd64
    build:
      context: ./agent-runtime
      target: with-callback
      additional_contexts:
        kirei-clients: ./.local/kirei-clients
    user: "10001:10001"
    command: [herdr, server]
    depends_on:
      local-volume-init:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - runtime-home:/home/runtime
      - runtime-workspace:/workspace
      - herdr-socket:/run/herdr

  backend-worker:
    depends_on:
      agent-runtime:
        condition: service_healthy

  backend-chat-listener:
    depends_on:
      mattermost:
        condition: service_healthy

  push-proxy:
    profiles: [push]
    image: mattermost/mattermost-push-proxy@sha256:eb47e608ad965306ab4052bfeacff74d4148099eb83831c84685bd8b30897ccd
    platform: linux/amd64
    user: "65534:65534"
    command: [-config, /mattermost-push-proxy/config/mattermost-push-proxy.json]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./push-service/config/local.json:/mattermost-push-proxy/config/mattermost-push-proxy.json:ro
    healthcheck:
      test: [CMD-SHELL, "printf 'GET /version HTTP/1.0\\r\\n\\r\\n' | nc -w 2 127.0.0.1 8066 | grep -q '\"version\":\"6.6.0\"'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  runtime-home:
  runtime-workspace:
