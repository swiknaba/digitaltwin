# Local PostgreSQL and reviewed, minimally packaged chat. Backend/Runtime wiring
# stays opt-in until reviewed component contracts and first boot pass.
services:
  local-volume-init:
    image: busybox:1.37.0-musl@sha256:dc88b80842580654294472735332ec7c7789a4010ec9a68b69f9b88c19abede6
    platform: linux/amd64
    user: "0:0"
    command: [/bin/sh, /scripts/init-local-volumes.sh]
    restart: "no"
    network_mode: none
    volumes:
      - ./scripts/init-local-volumes.sh:/scripts/init-local-volumes.sh:ro
      - ./chat-backend/config/phase0.json:/seed/phase0.json:ro
      - mattermost-config:/volumes/chat-config
      - mattermost-data:/volumes/chat-data
      - mattermost-logs:/volumes/chat-logs

  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the local database administrator password}
      KIREI_DB_PASSWORD: ${KIREI_DB_PASSWORD:?Set the local Kirei database password}
      MATTERMOST_DB_PASSWORD: ${MATTERMOST_DB_PASSWORD:?Set the local Mattermost database password}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/10-digitaltwin.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  mattermost:
    image: digitaltwin-chat-backend:local
    build:
      context: ./chat-backend
    platform: linux/amd64
    user: "2000:2000"
    depends_on:
      postgres:
        condition: service_healthy
      local-volume-init:
        condition: service_completed_successfully
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:${MATTERMOST_DB_PASSWORD:?Set the local Mattermost database password}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_PLUGINSETTINGS_ENABLE: "false"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "false"
      MM_PLUGINSETTINGS_ENABLEMARKETPLACE: "false"
      MM_PLUGINSETTINGS_ENABLEREMOTEMARKETPLACE: "false"
      MM_PLUGINSETTINGS_AUTOMATICPREPACKAGEDPLUGINS: "false"
      MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS: "false"
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"
    healthcheck:
      test: [CMD, /mattermost/bin/mmctl, system, status, --local]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    ports:
      - "127.0.0.1:8065:8065"
    volumes:
      - mattermost-config:/mattermost/config
      - mattermost-data:/mattermost/data
      - mattermost-logs:/mattermost/logs

volumes:
  postgres-data:
  mattermost-config:
  mattermost-data:
  mattermost-logs:
