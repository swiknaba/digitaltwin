# Local upstream dependencies only. Component workers add application services
# after their startup and Task 1 compatibility contracts pass.
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the local database administrator password}
      KIREI_DB_PASSWORD: ${KIREI_DB_PASSWORD:?Set the local Kirei database password}
      MATTERMOST_DB_PASSWORD: ${MATTERMOST_DB_PASSWORD:?Set the local Mattermost database password}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/10-digitaltwin.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  mattermost:
    image: mattermost/mattermost-team-edition:11.11.1@sha256:6ad5912b45875ef2fafc41886b5a70a3ec1b6c17ec706e0492566e8a2fd8aa85
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:${MATTERMOST_DB_PASSWORD:?Set the local Mattermost database password}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_PLUGINSETTINGS_ENABLE: "false"
    ports:
      - "127.0.0.1:8065:8065"
    volumes:
      - mattermost-config:/mattermost/config
      - mattermost-data:/mattermost/data
      - mattermost-logs:/mattermost/logs

volumes:
  postgres-data:
  mattermost-config:
  mattermost-data:
  mattermost-logs:
