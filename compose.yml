# OpenCode is operator-managed. This local stack retains only Kirei's future
# commitment service and its database.
name: digitaltwin

services:
  backend-migrate:
    build:
      context: "./integration-backend"
      dockerfile: Dockerfile
    command: ["bundle", "exec", "rake", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &backend-environment
      DATABASE_URL: "postgres://kirei:${KIREI_DB_PASSWORD:?Set the local Kirei database password}@postgres:5432/digitaltwin_development"
      DB_POOL_SIZE: "5"
      DB_POOL_TIMEOUT: "2"
      PORT: "3000"
      RACK_ENV: development
    image: digitaltwin-integration-backend:local
    restart: "no"
    user: "10001:10001"

  backend-web:
    build:
      context: "./integration-backend"
      dockerfile: Dockerfile
    command: ["bin/web"]
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    environment: *backend-environment
    healthcheck:
      interval: 5s
      retries: 12
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/readyz')).code == '200' ? 0 : 1)"]
      timeout: 5s
    image: digitaltwin-integration-backend:local
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    user: "10001:10001"

  backend-worker:
    build:
      context: "./integration-backend"
      dockerfile: Dockerfile
    command: ["bin/worker"]
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    environment: *backend-environment
    healthcheck:
      interval: 5s
      retries: 12
      test: ["CMD", "bin/health", "worker"]
      timeout: 5s
    image: digitaltwin-integration-backend:local
    user: "10001:10001"

  postgres:
    environment:
      KIREI_DB_PASSWORD: "${KIREI_DB_PASSWORD:?Set the local Kirei database password}"
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set the local database administrator password}"
      POSTGRES_USER: postgres
    healthcheck:
      interval: 5s
      retries: 12
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      timeout: 5s
    image: postgres:18.6-alpine
    volumes:
      - source: postgres-data
        target: "/var/lib/postgresql"
        type: volume
      - bind:
          create_host_path: true
        read_only: true
        source: "./scripts/init-postgres.sh"
        target: "/docker-entrypoint-initdb.d/10-digitaltwin.sh"
        type: bind

volumes:
  postgres-data: {}
