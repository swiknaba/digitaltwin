# Local-only Commander or direct-worker activation. The ignored directory holds
# existing chat credential files, the role configuration and the explicit
# activation acknowledgement. It does not mount provider credentials into Kirei.
services:
  backend-web:
    environment: &local_dispatch_environment
      CHAT_VALIDATION_MODE: "0"
      COMMANDER_CHANNEL_ID: "${COMMANDER_CHANNEL_ID:-}"
      LOCAL_DISPATCH_ACTIVATION_FILE: "/local-config/local-dispatch.json"
      MATTERMOST_AGENT_BOT_ID: "${MATTERMOST_AGENT_BOT_ID:?Set the local Commander bot id}"
      MATTERMOST_AGENT_TOKEN_FILE: "/local-config/agent.token"
      MATTERMOST_CHANNEL_IDS: "${MATTERMOST_CHANNEL_IDS:?Set monitored Mattermost channel ids}"
      MATTERMOST_LISTENER_TOKEN_FILE: "/local-config/listener.token"
      MATTERMOST_LOCAL_BOT_IDS: "${MATTERMOST_LOCAL_BOT_IDS:?Set local Mattermost bot ids}"
      MATTERMOST_PEER_BOT_IDS: "${MATTERMOST_PEER_BOT_IDS:-}"
      MATTERMOST_WORKER_BOT_ID: "${MATTERMOST_WORKER_BOT_ID:?Set the local Worker bot id}"
      MATTERMOST_WORKER_TOKEN_FILE: "/local-config/worker.token"
      ROLE_CONFIG_FILE: "/local-config/roles.json"
    volumes: &local_dispatch_volumes
      - type: bind
        source: "${DIGITALTWIN_LOCAL_CONFIG_DIR:?Set an absolute ignored local config directory}"
        target: "/local-config"
        read_only: true
  backend-worker:
    environment: *local_dispatch_environment
    volumes: *local_dispatch_volumes
  backend-chat-listener:
    environment: *local_dispatch_environment
    volumes: *local_dispatch_volumes
