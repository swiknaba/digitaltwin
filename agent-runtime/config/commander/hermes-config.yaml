skills:
  # Keep agent-authored, mutable procedure knowledge apart from any curated
  # baseline installed into skills/. Both locations remain Commander-local.
  create_dir: learned-skills

mcp_servers:
  digitaltwin:
    command: /usr/local/bin/digitaltwin-mcp
    args: []
    env:
      DIGITALTWIN_CALLBACK_URL: ${DIGITALTWIN_CALLBACK_URL}
      DIGITALTWIN_COMMANDER_REQUEST_TOKEN_FILE: ${DIGITALTWIN_COMMANDER_REQUEST_TOKEN_FILE}
    tools:
      include:
        - list_projects
        - list_workflows
        - read_context
        - workflow_status
        - start_workflow
        - send_prompt
        - workflow_control
