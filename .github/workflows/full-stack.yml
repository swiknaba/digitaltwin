name: Full stack
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: full-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Stage pinned clients
        run: scripts/prepare-callback-context
      - name: Cache backend build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: integration-backend
          platforms: linux/amd64
          cache-from: type=gha,scope=full-stack-backend
          cache-to: type=gha,scope=full-stack-backend,mode=max
      - name: Cache chat build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: chat-backend
          platforms: linux/amd64
          cache-from: type=gha,scope=full-stack-chat
          cache-to: type=gha,scope=full-stack-chat,mode=max
      - name: Cache Runtime build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: agent-runtime
          target: with-callback
          platforms: linux/amd64
          build-contexts: kirei-clients=./.local/kirei-clients
          cache-from: type=gha,scope=full-stack-runtime
          cache-to: type=gha,scope=full-stack-runtime,mode=max
      - name: Test real disposable stack
        env:
          DIGITALTWIN_TEST_ARTIFACTS: ${{ runner.temp }}/digitaltwin-test-artifacts
        run: scripts/test-full-stack
      - name: Upload sanitized failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-stack-failure
          path: ${{ runner.temp }}/digitaltwin-test-artifacts/*.json
          if-no-files-found: ignore
          retention-days: 3
